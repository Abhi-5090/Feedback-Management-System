# ── Render Blueprint: the FMS API ────────────────────────────────────────────
#
# Deploy with Render's "New > Blueprint" pointed at this repository, or create
# the service by hand using the same values.
#
# The FRONTEND is not here — it goes to Vercel, which proxies /api back to this
# service so the auth cookie stays first-party. See FMS_Frontend/VERCEL.md for
# why that matters more than it sounds.
#
# Secrets are marked `sync: false`, so Render prompts for them once and never
# stores them in this file. Nothing here is a credential.

services:
  - type: web
    name: fms-api
    runtime: node
    plan: starter          # free spins down after ~15 min idle — see note below
    region: singapore      # pick whichever is nearest your Atlas cluster
    rootDir: FMS_Backend
    buildCommand: npm ci
    startCommand: npm start
    # Readiness, not liveness. /api/health only says the process is up;
    # /api/ready also proves the database answers, so Render will not route
    # traffic to an instance whose Atlas connection has dropped.
    healthCheckPath: /api/ready
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"

      # Render provides PORT and expects the app to bind it. env.js already
      # reads process.env.PORT, so nothing else is needed.

      # ── Database ──────────────────────────────────────────────────────────
      # Your Atlas SRV string. Atlas must allow connections from Render:
      # on the free tier Render's outbound IPs are not static, so either use
      # Atlas's 0.0.0.0/0 entry (protected by the password, still not ideal) or
      # move to a Render plan with static outbound IPs and allowlist those.
      - key: MONGO_URI
        sync: false

      # ── Secrets (32+ chars; the boot guard refuses weak values in prod) ────
      # Generate with: openssl rand -hex 32
      - key: JWT_SECRET
        generateValue: true
      # DEVICE_SALT must stay STABLE FOREVER. Every DeviceLock row is derived
      # from it; rotate it and every existing lock stops matching, so students
      # who already answered could answer again on a still-open batch.
      # generateValue would produce a new one on a fresh deploy, so it is
      # entered by hand once and then left alone.
      - key: DEVICE_SALT
        sync: false

      # ── Cookies ───────────────────────────────────────────────────────────
      # Render terminates TLS, so Secure is correct and required.
      - key: COOKIE_SECURE
        value: "true"
      # 'lax' is right because Vercel proxies /api, making the API same-origin
      # with the app. Only change this if you decide to call Render directly
      # from the browser, and read FMS_Frontend/VERCEL.md first.
      - key: COOKIE_SAMESITE
        value: lax

      # ── Origins ───────────────────────────────────────────────────────────
      # Your Vercel URL. Comma-separated if you have several (production plus a
      # custom domain). Preview deployments get their own hostnames, so add
      # them here too if you want previews to work.
      - key: CLIENT_ORIGINS
        sync: false
      # Used to build links inside emails (password reset). Must be the URL a
      # person can actually open — the Vercel one, not this service.
      - key: APP_URL
        sync: false
      - key: APP_NAME
        value: Torii Training Feedback

      # ── Email ─────────────────────────────────────────────────────────────
      # Without these the mailer only PRINTS messages to the Render log, so
      # password reset silently does nothing. The service logs a loud warning
      # at boot when they are missing, and Settings shows a banner.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: RESET_TOKEN_MINUTES
        value: "30"

      # ── Capacity ──────────────────────────────────────────────────────────
      # Single process. Clustering only helps with more than one CPU, and the
      # smaller Render instances have a fraction of one — forking there adds
      # memory and contention for no throughput. On a multi-CPU instance,
      # switch startCommand to `npm run start:cluster` and set WEB_CONCURRENCY
      # to the core count.
      #
      # MONGO_MAX_POOL_SIZE is a budget for the whole deployment and is divided
      # across workers. Atlas shared tiers cap the CLUSTER at 500 connections
      # across every client, so keep this well under that.
      - key: MONGO_MAX_POOL_SIZE
        value: "60"

      # Student endpoints are keyed on the per-device cookie, not the IP, so a
      # classroom behind one campus NAT is not throttled as a single client.
      # PUBLIC_IP_MAX is the wider per-IP backstop against a scripted flood.
      - key: PUBLIC_MAX_PER_DEVICE
        value: "20"
      - key: PUBLIC_IP_MAX
        value: "5000"
      - key: LOGIN_MAX_PER_IDENTITY
        value: "20"
      - key: LOGIN_IP_MAX
        value: "300"

      - key: DIGESTS_ENABLED
        value: "true"

      # ── Keep-alive ────────────────────────────────────────────────────────
      # Set KEEP_ALIVE_URL to this service's own public /api/health and the
      # process pings itself on an interval, so the free instance never goes
      # 15 minutes without inbound traffic and never pays the ~35s cold start.
      #
      # It must be the PUBLIC url. Render counts inbound traffic, so a request
      # to 127.0.0.1 never leaves the container and does not reset the idle
      # timer. Leave it unset to disable — which is also what local runs and CI
      # do, so nothing pings anything unless a deployment asks for it.
      #
      # This can only PREVENT a sleep, never end one: an instance that is
      # already down cannot ping itself awake. .github/workflows/keepalive.yml
      # is the external half that can.
      - key: KEEP_ALIVE_URL
        value: "https://fms-api-dzuv.onrender.com/api/health"
      - key: KEEP_ALIVE_MINUTES
        value: "3"

      # ── Observability ─────────────────────────────────────────────────────
      # LOG_LEVEL drives verbosity; logs are newline-delimited JSON in
      # production so a log drain can parse them.
      - key: LOG_LEVEL
        value: "info"
      # Opt-in error tracking. Without a DSN nothing is initialised and no
      # data leaves the process, which is the default.
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      # /api/metrics is a Prometheus scrape target. Request counts by route
      # are not secret, but they describe usage, and this deployment is public
      # — so the endpoint takes a bearer token.
      - key: METRICS_TOKEN
        sync: false

  # ── Staging ─────────────────────────────────────────────────────────────────
  #
  # Every change in this project's history went straight from a laptop to the
  # service students use. CI is thorough, but no unit test catches a missing
  # environment variable, a migration that behaves differently against real
  # data, or an index that was never created on the live cluster. Those only
  # show up against a deployed copy.
  #
  # This service is identical to production in every way EXCEPT:
  #   - it tracks the `staging` branch, so main is never the first deploy,
  #   - it points at a SEPARATE Atlas database (see MONGO_URI below),
  #   - it does not keep itself awake: a staging instance that sleeps is
  #     correct behaviour, and it would otherwise double the free-tier hours.
  #
  # Promote with:  git checkout staging && git merge main && git push
  #                → verify → git checkout main && git push
  - type: web
    name: fms-api-staging
    runtime: node
    plan: starter
    region: singapore
    rootDir: FMS_Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/ready
    autoDeploy: true
    branch: staging

    envVars:
      - key: NODE_ENV
        value: production        # staging must run the production code path
      - key: NODE_VERSION
        value: "20"

      # MUST be a different cluster or database name from production. Pointing
      # staging at the live database makes it a loaded gun: the first migration
      # you rehearse rewrites the real data, which is the exact failure this
      # environment exists to prevent.
      - key: MONGO_URI
        sync: false

      - key: JWT_SECRET
        sync: false
      - key: DEVICE_SALT
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: "none"
      - key: CLIENT_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      - key: APP_NAME
        value: "Feedback Management System (staging)"

      # Verbose by default — staging exists to be inspected.
      - key: LOG_LEVEL
        value: "debug"
      - key: SENTRY_DSN
        sync: false
      - key: METRICS_TOKEN
        sync: false

      # Deliberately NOT set: a staging instance is allowed to sleep.
      # - key: KEEP_ALIVE_URL

      # Digests off. Staging must never mail a real mentor.
      - key: DIGESTS_ENABLED
        value: "false"

# ── A note on the free plan ──────────────────────────────────────────────────
# Render's free web services sleep after ~15 minutes of inactivity and take
# roughly 50 seconds to wake. For a feedback session that is the difference
# between "the form is slow" and "the form is broken" for whoever arrives first,
# and a class of 300 all arrive at once. Use a paid instance for any session
# that matters, or warm it a few minutes beforehand by opening the app.
