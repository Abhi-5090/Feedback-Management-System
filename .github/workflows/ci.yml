name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FMS_Backend/package-lock.json
      - name: Install backend deps
        working-directory: FMS_Backend
        run: npm ci
      - name: Run tests (in-memory Mongo replica set → transaction path)
        working-directory: FMS_Backend
        run: npm test

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: FMS_Frontend/package-lock.json
      - name: Install frontend deps
        working-directory: FMS_Frontend
        run: npm ci
      - name: Build
        working-directory: FMS_Frontend
        run: npm run build
